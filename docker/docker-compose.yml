name: pulsegate

x-app-env: &app-env
  NODE_ENV: production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: pulsegate
  POSTGRES_PASSWORD: pulsegate
  POSTGRES_DB: pulsegate
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BROKERS: kafka:29092
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: pulsegate
  CLICKHOUSE_DB: pulsegate
  OPERATOR_SIM_URL: http://operator-sim:3010
  LEASE_DEFAULT_SIZE: "1000"
  LEASE_REFILL_THRESHOLD: "0.3"
  RATE_LIMIT_EXPRESS: "200"
  RATE_LIMIT_NORMAL: "50"
  RATE_LIMIT_WINDOW_SEC: "1"
  CB_FAILURE_THRESHOLD: "5"
  CB_OPEN_MS: "10000"

x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["infra", "full"]
    environment:
      POSTGRES_USER: pulsegate
      POSTGRES_PASSWORD: pulsegate
      POSTGRES_DB: pulsegate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsegate -d pulsegate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["infra", "full"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    profiles: ["infra", "full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Host apps → localhost:9092 ; Compose apps → kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["infra", "full"]
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/default-password.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["infra", "full"]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./clickhouse/init.sql:/init.sql:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "clickhouse-client --host clickhouse --password pulsegate --multiquery < /init.sql",
      ]
    restart: "no"

  migrate:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "npm run db:migrate && npm run db:seed",
      ]
    restart: "no"

  api:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
      API_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: ["node", "apps/api/dist/main.js"]

  operator-sim:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
      OPERATOR_PORT: "3010"
    ports:
      - "3010:3010"
    command: ["node", "apps/operator-sim/dist/main.js"]

  worker-express:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
      WORKER_MODE: express
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      operator-sim:
        condition: service_started
    command: ["node", "apps/worker/dist/main.js"]

  worker-normal:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
      WORKER_MODE: normal
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      operator-sim:
        condition: service_started
    command: ["node", "apps/worker/dist/main.js"]

  worker-heavy:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
      WORKER_MODE: heavy
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      operator-sim:
        condition: service_started
    command: ["node", "apps/worker/dist/main.js"]

  projector:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    command: ["node", "apps/projector/dist/main.js"]

  ledger:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "apps/ledger/dist/main.js"]

  reconciler:
    profiles: ["full"]
    build: *app-build
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "apps/reconciler/dist/main.js"]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  chdata:
